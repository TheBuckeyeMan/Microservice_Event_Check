#Template Workflow for Java API's
name: Java CI/CD Pipeline

on:
  push:
    branches:
      - master
      - UAT
      - Working_Email_Code_Locally #Add additional branches if we neeed to add additional branches

jobs:
  Maven_Build:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package dependency:copy-dependencies -DincludeScope=runtime
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Pass job 1 to job 2
        uses: actions/upload-artifact@v3
        with:
          name: job1
          path: .


  Docker_Build:
    runs-on: ubuntu-latest
    needs: Maven_Build
    steps:
      - name: Download code and Dockerfile
        uses: actions/download-artifact@v3
        with:
          name: job1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Building Docker Image... # Edit regions if you would like to deploy to different regions
        run: |
          docker build -t thebuckeyeman20/api:PlaceholderContainer .
    
      - name: Save Docker Image as Artifact
        run: |
          docker save -o image.tar thebuckeyeman20/api:PlaceholderContainer
            
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: image.tar


  Dockerhub_Push:
    runs-on: ubuntu-latest
    needs: Docker_Build
    steps:

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Load Docker Image
        run: |
          docker load -i image.tar

      - name: Logging into Docker Hub...
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to Docker Hub
        run: |
          docker push thebuckeyeman20/api:PlaceholderContainer


  AWS_ECR_Push:
    runs-on: ubuntu-latest
    needs: Docker_Build
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Load Docker Image
        run: |
          docker load -i image.tar

      - name: Re-tag Docker Image for ECR
        run: |
          docker tag thebuckeyeman20/api:PlaceholderContainer ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/youtube-containers:PlaceholderContainer

      - name: Configuring AWS Credentials...
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region ${{ secrets.AWS_REGION }}
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Pushing Docker Image to ECR...
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/youtube-containers:PlaceholderContainer


  Trigger_CD_Pipeline:
    runs-on: ubuntu-latest
    needs: AWS_ECR_Push
    steps:
      - name: Provisioning Infrastructure...
        env:
          CICD_GH_TOKEN: ${{ secrets.CICD_GH_TOKEN }}
        run: |
          repo_owner="TheBuckeyeMan"
          repo_name="Finalized_API_IAC"
          workflow_id="ci.yml"
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CICD_GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/actions/workflows/$workflow_id/dispatches \
            -d "{\"ref\": \"lambda\"}"
            